name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "47 7 1 * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: "1"

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate workflow syntax and expressions
        shell: bash
        run: |
          docker run --rm \
            --volume "$PWD:/repo:ro" \
            --workdir /repo \
            rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            .github/workflows/ci.yml

      - name: Install the exact Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: "1.97.0"
          components: rustfmt, clippy

      - name: Cache locked Rust dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Check all targets
        run: cargo check --locked --all-targets --all-features

      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Test all unit and real-transport contracts
        run: cargo test --locked --all-targets --all-features

      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps --all-features

      - name: Release build
        run: cargo build --locked --release --all-features

      - name: Enforce process-bootstrap boundaries
        shell: bash
        run: |
          set -euo pipefail
          test -f src/bootstrap.rs
          test -f BOOTSTRAP.md
          test "$(wc -l < src/main.rs)" -le 6
          git grep -qF 'pub async fn run' -- src/bootstrap.rs
          git grep -qF 'Args::parse' -- src/bootstrap.rs
          git grep -qF 'into_server_config' -- src/bootstrap.rs
          git grep -qF 'The executable bootstrap must not parse events' -- BOOTSTRAP.md
          if git grep -nE 'clap::Parser|StorageConfig|ServerConfig|tracing_subscriber|handle\.wait' -- src/main.rs; then
            echo 'CLI parsing, telemetry, configuration, and lifecycle waiting must remain outside src/main.rs' >&2
            exit 1
          fi
          git diff --check
